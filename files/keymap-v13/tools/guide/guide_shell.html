<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C100 MIDI Guide</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f5f7fa; --ink:#18212d; --muted:#586577; --line:#d3dae3; --accent:#0a6cff; --accent-ink:#ffffff;
  --plate:#10151c; --unlit:#1c232d; --cap:#2b3441; --capline:#0a0e13; --glow:#ffffff; --good:#12805c; --warn:#b4570a;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --panel:#171e27; --panel2:#1d2631; --ink:#e8edf4; --muted:#9ba8b9; --line:#2b3644; --accent:#6aa4ff; --accent-ink:#0a1220;
  --plate:#0a0d12; --unlit:#171d26; --cap:#273040; --capline:#05070a; --good:#4cc79a; --warn:#f0a35e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --panel:#171e27; --panel2:#1d2631; --ink:#e8edf4; --muted:#9ba8b9; --line:#2b3644; --accent:#6aa4ff; --accent-ink:#0a1220;
  --plate:#0a0d12; --unlit:#171d26; --cap:#273040; --capline:#05070a; --good:#4cc79a; --warn:#f0a35e; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--ui)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
.top .sp{flex:1}
.top a.tool{font-size:14px;text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);white-space:nowrap}
.top button.theme{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);cursor:pointer}
.menu-btn{display:none;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);cursor:pointer}
.wrap{display:grid;grid-template-columns:272px minmax(0,1fr);gap:0;max-width:1480px;margin:0 auto}
nav.toc{position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow:auto;padding:16px 14px 40px;border-right:1px solid var(--line);font-size:14px}
nav.toc h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
nav.toc a{display:block;padding:5px 10px;border-radius:7px;text-decoration:none;color:var(--ink)}
nav.toc a:hover{background:var(--panel2)}
nav.toc a.cur{background:var(--accent);color:var(--accent-ink)}
nav.toc a small{opacity:.7}
main{padding:20px clamp(14px,3vw,36px) 80px;min-width:0}
section.sec{margin:0 0 52px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
h2.title{font-size:clamp(24px,3.2vw,34px);line-height:1.15;margin:0 0 6px}
.tag{font-size:18px;color:var(--muted);margin:0 0 18px;max-width:70ch}
.hero{padding:26px clamp(16px,3vw,34px);border-radius:18px;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);margin-bottom:34px}
.hero h2{font-size:clamp(28px,4vw,44px);margin:0 0 8px;line-height:1.1}
.hero p{max-width:68ch;color:var(--muted);font-size:18px}
.layer-head{margin:56px 0 18px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.layer-head h2{margin:0;font-size:clamp(26px,3.4vw,38px)}
.layer-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.card{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 26px;align-items:start}
.card.single{grid-template-columns:minmax(0,1fr)}
.card h3{margin:0 0 2px;font-size:clamp(21px,2.6vw,27px);line-height:1.2}
.card .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.card .what{margin:6px 0 12px;font-size:17px}
.card h4{margin:16px 0 6px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.card ol,.card ul{margin:0;padding-left:22px}
.card li{margin:4px 0}
.card .tip{background:var(--panel2);border-left:4px solid var(--accent);padding:8px 12px;border-radius:6px;margin:6px 0}
.card .warn{border-left-color:var(--warn)}
kbd,.k{display:inline-block;font:600 .88em var(--mono);padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--panel2);white-space:nowrap}
details.ref{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
details.ref summary{cursor:pointer;padding:9px 12px;font-weight:600}
details.ref .refbody{padding:4px 14px 12px;font-size:14px;max-height:340px;overflow:auto}
details.ref .refbody div{padding:3px 0;border-top:1px solid var(--line)}
details.ref .refbody div:first-child{border-top:0}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.pn a{font-size:14px;text-decoration:none}
/* ---- board ---- */
.stage{min-width:0}
.boardwrap{container-type:inline-size;position:relative;background:var(--plate);padding:2.2cqw;border-radius:14px;box-shadow:inset 0 0 0 1px #000}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:.9cqw;position:relative}
.key{position:relative;aspect-ratio:1;border-radius:1.2cqw;border:1px solid var(--capline);background:var(--cap);color:#cfd7e2;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center;overflow:hidden;font-size:2.2cqw;padding:0;transition:transform .06s}
.key .m{font-weight:700;max-width:100%;white-space:nowrap}
.key .s{font-size:.72em;opacity:.8;max-width:100%;white-space:nowrap}
.key.dark{background:var(--unlit);color:#9aa5b4}
.key.fn:not(.lit){background:#3a3322;border-color:#b38a2e;color:#f2d896}
.key.cc:not(.lit){background:#1f2d44;border-color:#4f7bc4;color:#b7cdf2}
.key.none:not(.lit){background:repeating-linear-gradient(135deg,#0d1218 0 5px,#161d27 5px 6px);color:#556070;border-color:#0a0e13}
.key.lit{background:var(--led);border-color:color-mix(in srgb,var(--led) 55%,#000);box-shadow:0 0 1.6cqw color-mix(in srgb,var(--led) 70%,transparent);color:var(--ledtext)}
.key.text .m,.key.text .s{visibility:hidden}
.key.down{transform:translateY(.4cqw) scale(.94);outline:.35cqw solid #fff}
.key.look::after{content:"";position:absolute;inset:0;border-radius:inherit;border:.5cqw solid #fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.key.look::after{animation:none;opacity:1}}
.sgwrap{margin:12px 0;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2)}
.sgt{font-weight:700;margin-bottom:8px}.sgn{font-size:13px;color:var(--muted);margin-top:8px}
.sg{display:grid;gap:4px;align-items:stretch}
.sgl{font-size:11px;color:var(--muted);align-self:center;padding-right:4px;white-space:nowrap}
.sg b{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:36px;padding:2px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:12px;text-align:center;line-height:1.1;overflow:hidden}
.sg b i{font-style:normal;font-weight:400;font-size:9px;opacity:.8}
.sg b.a{background:#3a3322;border-color:#b38a2e;color:#f2d896}.sg b.c{background:#1f2d44;border-color:#4f7bc4;color:#b7cdf2}
.sg b.g{background:#1d3a2b;border-color:#3fa26a;color:#b9ecd0}.sg b.p{background:#44233a;border-color:#c4568f;color:#f3c3df}.sg b.d{opacity:.4}
.sg b.k{background:#222a35;color:#dfe6ee}.sg b.n{background:repeating-linear-gradient(135deg,#0d1218 0 5px,#161d27 5px 6px);color:#556070;border-color:#0a0e13}
.sg.km{gap:3px}.sg.km b{min-height:0;aspect-ratio:1;font-size:9.5px}.sg.km b i{font-size:7.5px}
.zone{position:absolute;pointer-events:none;border:.45cqw dashed var(--zc);border-radius:1.6cqw;transition:opacity .3s}
.zone span{position:absolute;left:.6cqw;top:-2.7cqw;font:700 2cqw/1 var(--ui);background:var(--zc);color:#000;padding:.5cqw .9cqw;border-radius:.8cqw;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
.stage.playing .zone{opacity:.35}
.mark{position:absolute;pointer-events:none;width:4.4cqw;height:4.4cqw;border-radius:50%;background:#fff;color:#000;font:800 2.5cqw/4.4cqw var(--ui);text-align:center;box-shadow:0 0 0 .5cqw #000,0 .4cqw 1cqw rgba(0,0,0,.5);transform:translate(-30%,-30%)}
.legend{margin:10px 0 0;padding:0;list-style:none;font-size:14px;display:grid;gap:4px}
.legend li{display:flex;gap:8px;align-items:flex-start}
.legend b.num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;text-align:center;line-height:22px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}
.ctl button,.ctl select{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);cursor:pointer}
.ctl button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;min-width:96px}
.ctl input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.cap{min-height:3.6em;margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:15px}
.cap .n{font-weight:800;color:var(--accent);margin-right:6px}
.mon{margin:8px 0 0;font:12.5px/1.45 var(--mono);color:var(--muted);min-height:4.4em;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.mon div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon div:first-child{color:var(--ink)}
.mon .h{font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* layer map */
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 4px}
.map .lc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.map .lc b{display:block;font-size:15px;margin-bottom:6px}
.map .lc a{display:block;font-size:13.5px;padding:3px 8px;margin:3px 0;border-radius:7px;background:var(--panel2);text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.map .lc a:hover{border-color:var(--accent)}
table.t{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--panel2)}
.glos dt{font-weight:700;margin-top:10px}
.glos dd{margin:2px 0 0 0;color:var(--muted)}
footer{padding:30px 16px;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:1050px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav.toc{position:fixed;inset:57px 0 0 0;z-index:25;background:var(--panel);display:none;max-height:none}
  nav.toc.open{display:block}
  .menu-btn{display:inline-block}
  .card{grid-template-columns:minmax(0,1fr)}
  .map{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){.map{grid-template-columns:minmax(0,1fr)}.top a.tool{display:none}}
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="toc">Menu</button>
  <h1>C100 MIDI Guide</h1>
  <span class="sp"></span>
  <a class="tool" href="C100_virtual_keyboard.html">Virtual keyboard</a>
  <a class="tool" href="C100_keymap_planner.html">Planner</a>
  <button class="theme" id="themeBtn" aria-label="Switch light / dark theme">Light / dark</button>
</header>
<div class="wrap">
  <nav class="toc" id="toc" aria-label="Guide contents"></nav>
  <main id="main"></main>
</div>
